services:
  postgres:
    image: postgres:17
    container_name: postgres-lab
    hostname: postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TIMEZONE}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - database-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    hostname: pgadmin

    restart: unless-stopped

    env_file:
      - .env

    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    ports:
      - "${PGADMIN_PORT}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - database-network

volumes:
  postgres_data:
    name: postgres_data

  pgadmin_data:
    name: pgadmin_data

networks:
  database-network:
    name: database-network
    driver: bridge